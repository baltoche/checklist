<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EnCoche — ma check-list</title>
<meta name="description" content="EnCoche, votre check-list de poche : notez, cochez, avancez.">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#1f6f54">

<!-- ===== Couche PWA ===== -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="EnCoche">

<style>
:root{
  --paper:#f6f1e7; --card:#fffdf8; --ink:#243229; --ink-soft:#6b7a6f;
  --green:#1f6f54; --green-deep:#14513c; --green-soft:#e4f0e8;
  --amber:#f2b23e; --coral:#e05d44; --line:#e5ddcc;
  --radius:18px; --shadow:0 10px 30px rgba(31,60,45,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
  color:var(--ink); min-height:100vh;
  background:
    radial-gradient(1100px 480px at 88% -10%, #e8f2e4 0%, transparent 60%),
    radial-gradient(900px 420px at -10% 25%, #fdeecd 0%, transparent 55%),
    var(--paper);
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:radial-gradient(rgba(31,111,84,.07) 1.2px, transparent 1.6px);
  background-size:22px 22px;
}
body.locked{overflow:hidden}
.wrap{max-width:620px;margin:0 auto;padding:0 16px;position:relative;z-index:1}
::selection{background:var(--green);color:#fff}
:focus-visible{outline:3px solid rgba(242,178,62,.85);outline-offset:2px;border-radius:6px}
button{font-family:inherit}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(246,241,231,.92);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{display:flex;justify-content:space-between;align-items:center;padding-top:12px;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:9px}
.checks{display:flex;gap:3px}
.checks i{display:grid;place-items:center;width:15px;height:15px;border-radius:5px;
  background:var(--green);color:#fffdf6;font-style:normal;font-size:9px;font-weight:900;
  animation:popin .45s cubic-bezier(.34,1.56,.64,1) backwards}
.checks i:nth-child(2){animation-delay:.06s}.checks i:nth-child(3){animation-delay:.12s}
.checks i:nth-child(4){animation-delay:.18s}.checks i:nth-child(5){animation-delay:.24s}
@keyframes popin{from{opacity:0;transform:scale(0)}}
h1{font-size:19px;font-weight:800;letter-spacing:-.3px}
h1 .en{color:var(--green)}
.top-actions{display:flex;gap:8px;align-items:center}
.net{background:#fdeecd;border:1px solid #f0dcae;color:#8a6d1f;font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:99px}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);
  font-size:16px;cursor:pointer;transition:.2s;display:grid;place-items:center}
.icon-btn:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(31,60,45,.15)}
.install{border:0;background:var(--green);color:#fff;font-weight:800;font-size:13px;
  padding:8px 14px;border-radius:99px;cursor:pointer;box-shadow:0 6px 14px rgba(31,111,84,.35);transition:.2s}
.install:hover{background:var(--green-deep);transform:translateY(-1px)}

/* ---------- salutations ---------- */
.greet{padding:26px 0 14px}
.hello{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:clamp(30px,7vw,42px);letter-spacing:-.5px}
.date{color:var(--ink-soft);font-weight:600;margin-top:2px;font-size:14px}

/* ---------- progression ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.progress{padding:18px 20px;margin-top:6px}
.progress-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.pct{font-size:40px;font-weight:800;color:var(--green);letter-spacing:-1px}
.ratio{margin-left:8px;color:var(--ink-soft);font-weight:700;font-size:14px}
.plant{font-size:38px;line-height:1}
.plant.pop{animation:plantpop .5s}
@keyframes plantpop{40%{transform:scale(1.35) rotate(-6deg)}}
.bar{height:10px;border-radius:99px;background:#ece5d4;overflow:hidden}
.bar-fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--green),#3aa87e);
  transition:width .6s cubic-bezier(.4,1,.4,1)}
.msg{margin-top:10px;font-size:14px;color:var(--ink-soft);font-weight:600}

/* ---------- hasard ---------- */
.random{width:100%;margin:14px 0;padding:14px 16px;border-radius:14px;border:2px dashed var(--amber);
  background:#fff8ea;font-weight:700;font-size:15px;cursor:pointer;transition:.2s;
  display:flex;gap:10px;align-items:center;justify-content:center}
.random:hover{transform:translateY(-2px);box-shadow:var(--shadow);background:#fff3d6}
.random:active{transform:scale(.98)}

/* ---------- onglets ---------- */
.tabs{position:relative;display:flex;gap:2px;background:#ece5d4;border-radius:999px;padding:4px;margin:6px 0 16px}
.tab-pill{position:absolute;top:4px;bottom:4px;left:0;width:0;background:var(--green);border-radius:999px;
  transition:left .3s cubic-bezier(.5,1.4,.4,1),width .3s;box-shadow:0 4px 12px rgba(31,111,84,.35)}
.tab{flex:1;position:relative;z-index:1;border:0;background:none;padding:9px 6px;border-radius:999px;
  font-weight:600;font-size:13.5px;color:var(--ink-soft);cursor:pointer;
  display:flex;gap:6px;justify-content:center;align-items:center;transition:color .25s}
.tab b{background:rgba(0,0,0,.08);border-radius:999px;padding:1px 7px;font-size:11px}
.tab.is-active{color:#fff}
.tab.is-active b{background:rgba(255,255,255,.25)}

/* ---------- liste ---------- */
.list{list-style:none;display:flex;flex-direction:column;gap:10px;padding-bottom:24px}
.task{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:12px 12px 12px 14px;box-shadow:0 2px 0 rgba(60,70,60,.05);
  animation:rise .3s backwards;transition:transform .2s,box-shadow .2s,opacity .3s}
.task:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(31,60,45,.10)}
.task.done{opacity:.62}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.task.flash{animation:flash 1.3s ease}
@keyframes flash{
  30%{box-shadow:0 0 0 4px rgba(242,178,62,.6);transform:scale(1.015)}
  60%{box-shadow:0 0 0 9px rgba(242,178,62,.15)}}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--green);background:#fff;
  flex:none;cursor:pointer;display:grid;place-items:center;transition:.2s;padding:0}
.check:hover{transform:scale(1.12)}
.check svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:3.4;stroke-linecap:round;
  stroke-linejoin:round;opacity:0;transform:scale(.4);transition:.2s}
.task.done .check{background:var(--green)}
.task.done .check svg{opacity:1;transform:scale(1)}
.label{flex:1;border:0;background:linear-gradient(currentColor,currentColor) left center/0% 2px no-repeat;
  font:inherit;font-size:15.5px;font-weight:600;text-align:left;cursor:pointer;padding:4px 2px;
  transition:background-size .3s,color .3s;overflow-wrap:anywhere}
.task.done .label{background-size:100% 2px;color:var(--ink-soft)}
.mini{border:0;background:none;font-size:15px;opacity:.35;cursor:pointer;padding:6px;border-radius:8px;transition:.2s;flex:none}
.task:hover .mini{opacity:1}
.mini:hover{background:#f0ead9;transform:scale(1.12)}
.mini.del:hover{background:#fde4de}
@media (hover:none){.mini{opacity:.75}}
.clear-done{margin:2px auto 0;display:block;border:0;background:none;color:var(--ink-soft);
  font-size:13px;font-weight:700;cursor:pointer;padding:8px 12px;border-radius:10px}
.clear-done:hover{color:var(--coral);background:#fdeeea}

/* ---------- vide ---------- */
.empty{text-align:center;padding:44px 20px;border:2px dashed #d8cfb8;border-radius:18px;
  background:rgba(255,253,248,.6);margin-bottom:24px}
.empty-art{font-size:44px;margin-bottom:10px}
.empty-title{font-weight:800;font-size:17px}
.empty-sub{color:var(--ink-soft);font-size:14px;margin-top:6px}
main{padding-bottom:110px}

/* ---------- FAB ---------- */
.fab{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom));width:58px;height:58px;
  border-radius:50%;border:0;background:var(--green);color:#fff;font-size:26px;cursor:pointer;
  box-shadow:0 12px 26px rgba(20,81,60,.4);transition:.25s;z-index:30}
.fab:hover{transform:translateY(-3px) scale(1.05)}
.fab:active{transform:scale(.9)}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(24,36,29,.45);backdrop-filter:blur(4px);
  display:grid;place-items:center;z-index:50;padding:20px;animation:fade .2s}
.modal{width:min(430px,100%);background:var(--card);border-radius:20px;padding:24px;
  box-shadow:0 24px 60px rgba(0,0,0,.3);animation:zoom .25s cubic-bezier(.34,1.56,.64,1)}
.modal h2{font-size:20px;margin-bottom:14px}
.modal input{width:100%;font:inherit;font-size:17px;padding:12px 14px;border:2px solid var(--line);
  border-radius:12px;background:#fff;outline:none;transition:border .2s}
.modal input:focus{border-color:var(--green)}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.ghost{background:none;border:0;font-weight:700;color:var(--ink-soft);padding:10px 14px;border-radius:10px;cursor:pointer}
.ghost:hover{background:#f0ead9}
.primary{background:var(--green);border:0;color:#fff;font-weight:800;padding:10px 20px;border-radius:12px;cursor:pointer;transition:.2s}
.primary:hover{background:var(--green-deep)}
@keyframes fade{from{opacity:0}}
@keyframes zoom{from{opacity:0;transform:scale(.9)}}

/* ---------- toasts / confettis / hint iOS ---------- */
.toast-wrap{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);
  display:flex;flex-direction:column;gap:8px;z-index:60;align-items:center;max-width:92vw}
.toast{display:flex;gap:12px;align-items:center;background:#243229;color:#f6f1e7;padding:11px 16px;
  border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transform:translateY(12px);
  transition:.3s;font-size:14px}
.toast.show{opacity:1;transform:none}
.toast button{border:0;background:none;color:var(--amber);font-weight:800;cursor:pointer;font-size:14px}
.confetti{position:fixed;top:-8vh;font-size:22px;z-index:99;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),112vh) rotate(var(--rz))}}
.ios-hint{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));
  background:#243229;color:#f6f1e7;border-radius:14px;padding:12px 40px 12px 14px;font-size:13.5px;
  z-index:40;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.ios-hint button{position:absolute;right:8px;top:8px;background:none;border:0;color:#f6f1e7;font-size:16px;cursor:pointer}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap top-in">
    <div class="brand">
      <span class="checks" aria-hidden="true"><i>✓</i><i>✓</i><i>✓</i><i>✓</i><i>✓</i></span>
      <h1><span class="en">En</span>Coche</h1>
    </div>
    <div class="top-actions">
      <span id="netStatus" class="net" hidden>⛅ Hors ligne</span>
      <button id="soundBtn" class="icon-btn" aria-pressed="true" title="Voix">🔊</button>
      <button id="installBtn" class="install" hidden>⬇ Installer</button>
    </div>
  </div>
</header>

<div class="wrap">
  <section class="greet">
    <p class="hello" id="hello">Bonjour ! 👋</p>
    <p class="date" id="date"></p>
  </section>

  <section class="progress card">
    <div class="progress-head">
      <div>
        <span class="pct" id="pct">0%</span>
        <span class="ratio" id="ratio">0/0</span>
      </div>
      <div class="plant" id="plant" title="Votre plante grandit quand vous cochez !">🌱</div>
    </div>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    <p class="msg" id="msg">Ajoutez votre première tâche !</p>
  </section>

  <button class="random" id="randomBtn">🎲 Choisir une tâche au hasard</button>

  <nav class="tabs" id="tabs">
    <span class="tab-pill" id="tabPill"></span>
    <button class="tab is-active" data-filter="all">Toutes <b id="cAll">0</b></button>
    <button class="tab" data-filter="todo">À faire <b id="cTodo">0</b></button>
    <button class="tab" data-filter="done">Terminées <b id="cDone">0</b></button>
  </nav>

  <main>
    <ul class="list" id="list"></ul>
    <div class="empty" id="empty">
      <div class="empty-art" id="emptyArt">🗒️</div>
      <p class="empty-title" id="emptyTitle">Aucune tâche pour l'instant</p>
      <p class="empty-sub" id="emptySub">Appuyez sur le bouton ＋ pour créer la première.</p>
    </div>
    <button class="clear-done" id="clearDone" hidden>🧹 Effacer les tâches terminées</button>
  </main>
</div>

<button class="fab" id="addBtn" aria-label="Ajouter une tâche">＋</button>

<div class="overlay" id="overlay" hidden>
  <form class="modal" id="taskForm">
    <h2 id="modalTitle">Nouvelle tâche</h2>
    <input id="taskInput" maxlength="120" placeholder="Ex. Arroser les plantes 🌿" autocomplete="off" required>
    <div class="modal-actions">
      <button type="button" class="ghost" id="cancelBtn">Annuler</button>
      <button type="submit" class="primary" id="saveBtn">Ajouter</button>
    </div>
  </form>
</div>

<div class="toast-wrap" id="toasts"></div>

<div class="ios-hint" id="iosHint" hidden>
  📲 Pour installer EnCoche : touchez <b>Partager</b> puis <b>« Sur l'écran d'accueil »</b>.
  <button id="iosClose" aria-label="Fermer">✕</button>
</div>

<script>
'use strict';
/* ================= Données ================= */
const KEY='encoche.tasks.v1', SKEY='encoche.sound.v1';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch{return[]}}
function save(){localStorage.setItem(KEY,JSON.stringify(tasks))}

let tasks=load(), filter='all', editingId=null, flashId=null, prevPlant=null;
let soundOn=localStorage.getItem(SKEY)!=='off';

/* ================= Éléments ================= */
const $=s=>document.querySelector(s);
const listEl=$('#list'), emptyEl=$('#empty'), pctEl=$('#pct'), ratioEl=$('#ratio'),
  msgEl=$('#msg'), plantEl=$('#plant'), barEl=$('#barFill'),
  cAll=$('#cAll'), cTodo=$('#cTodo'), cDone=$('#cDone'),
  overlay=$('#overlay'), form=$('#taskForm'), input=$('#taskInput'),
  modalTitle=$('#modalTitle'), saveBtn=$('#saveBtn'),
  soundBtn=$('#soundBtn'), installBtn=$('#installBtn'),
  toastsEl=$('#toasts'), clearBtn=$('#clearDone'), pill=$('#tabPill'), netEl=$('#netStatus');

/* ================= Voix ================= */
function speak(text){
  if(!soundOn||!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='fr-FR'; u.rate=1.05;
    const v=speechSynthesis.getVoices().find(v=>v.lang.startsWith('fr'));
    if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch{}
}

/* ================= Plante ================= */
const PLANTS=['🌱','🌿','🪴','🌼','🌳'];
const plantFor=d=>d>=10?'🌳':d>=7?'🌼':d>=4?'🪴':d>=2?'🌿':'🌱';

/* ================= Rendu ================= */
function render(){
  const total=tasks.length, done=tasks.filter(t=>t.done).length, todo=total-done;
  const pct=total?Math.round(done/total*100):0;

  pctEl.textContent=pct+'%';
  ratioEl.textContent=done+'/'+total;
  barEl.style.width=pct+'%';
  msgEl.textContent=!total?"Ajoutez votre première tâche !"
    :pct===100?"Tout est coché, bravo ! 🎉"
    :pct>=50?"Belle avancée, continuez ! 💪"
    :"Une coche après l'autre ✏️";

  const p=plantFor(done);
  if(prevPlant!==null&&PLANTS.indexOf(p)>PLANTS.indexOf(prevPlant)){
    toast('Votre plante grandit '+p); speak('Votre plante grandit');
  }
  prevPlant=p;
  plantEl.textContent=p;
  plantEl.classList.remove('pop'); void plantEl.offsetWidth; plantEl.classList.add('pop');

  cAll.textContent=total; cTodo.textContent=todo; cDone.textContent=done;

  const visible=tasks.filter(t=>filter==='all'?true:filter==='todo'?!t.done:t.done);
  listEl.innerHTML='';
  visible.forEach(t=>listEl.appendChild(taskNode(t)));

  if(!visible.length){
    emptyEl.hidden=false;
    const art=$('#emptyArt'), ti=$('#emptyTitle'), su=$('#emptySub');
    if(!total){art.textContent='🗒️';ti.textContent="Aucune tâche pour l'instant";
      su.textContent="Appuyez sur le bouton ＋ pour créer la première.";}
    else if(filter==='todo'){art.textContent='☕';ti.textContent="Rien à faire ici 👌";
      su.textContent="Tout est terminé — profitez-en !";}
    else{art.textContent='🌤️';ti.textContent="Rien dans cette vue 👌✕";
      su.textContent="Les tâches cochées apparaîtront ici.";}
  }else emptyEl.hidden=true;

  clearBtn.hidden=done===0;
  requestAnimationFrame(movePill);
}

function taskNode(t){
  const li=document.createElement('li');
  li.className='task'+(t.done?' done':'')+(t.id===flashId?' flash':'');
  li.dataset.id=t.id;
  const chk=document.createElement('button');
  chk.className='check';
  chk.setAttribute('aria-label',t.done?'Marquer à faire':'Marquer terminée');
  chk.innerHTML='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const lab=document.createElement('button');
  lab.className='label'; lab.textContent=t.label; lab.title='Modifier';
  const sp=document.createElement('button');
  sp.className='mini'; sp.textContent='🔊'; sp.title='Écouter';
  const del=document.createElement('button');
  del.className='mini del'; del.textContent='✕'; del.title='Supprimer';
  li.append(chk,lab,sp,del);
  return li;
}

function movePill(){
  const a=document.querySelector('.tab.is-active'); if(!a) return;
  pill.style.left=a.offsetLeft+'px'; pill.style.width=a.offsetWidth+'px';
}
addEventListener('resize',()=>requestAnimationFrame(movePill));

/* ================= Actions ================= */
listEl.addEventListener('click',e=>{
  const li=e.target.closest('.task'); if(!li) return;
  const t=tasks.find(x=>x.id===li.dataset.id); if(!t) return;
  if(e.target.closest('.check')) toggle(t);
  else if(e.target.closest('.del')) removeTask(t.id);
  else if(e.target.closest('.mini')) speak(t.label);
  else if(e.target.closest('.label')) openModal(t.id);
});

function toggle(t){
  t.done=!t.done; save(); render();
  if(t.done){
    const i=Math.floor(Math.random()*4);
    toast(['Bien joué ! 🎯','Joli ! ✨','Une de plus ✔️','Super ! 🙌'][i]);
    speak(['Bien joué','Joli','Une de plus','Super'][i]);
    if(tasks.length&&tasks.every(x=>x.done)) celebrate();
  }
}

function celebrate(){ confetti(); speak('Bravo, tout est fait !'); }

function removeTask(id){
  const i=tasks.findIndex(t=>t.id===id); if(i<0) return;
  const [t]=tasks.splice(i,1); save(); render();
  const label=t.label.length>26?t.label.slice(0,26)+'…':t.label;
  toast(`« ${label} » supprimée`,{label:'Annuler',fn:()=>{
    tasks.splice(Math.min(i,tasks.length),0,t); save(); render();
  }});
}

clearBtn.onclick=()=>{
  const removed=tasks.filter(t=>t.done); if(!removed.length) return;
  tasks=tasks.filter(t=>!t.done); save(); render();
  toast(removed.length+' tâche(s) effacée(s)',{label:'Annuler',fn:()=>{
    tasks=tasks.concat(removed); save(); render();
  }});
};

$('#randomBtn').onclick=()=>{
  const pool=tasks.filter(t=>!t.done);
  if(!pool.length){ toast('Aucune tâche en attente 🤷'); return; }
  const pick=pool[Math.floor(Math.random()*pool.length)];
  if(filter==='done'){
    filter='all';
    document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('is-active',b.dataset.filter==='all'));
  }
  flashId=pick.id; render();
  const li=listEl.querySelector(`[data-id="${pick.id}"]`);
  if(li) li.scrollIntoView({behavior:'smooth',block:'center'});
  setTimeout(()=>{flashId=null;
    const el=listEl.querySelector(`[data-id="${pick.id}"]`);
    if(el) el.classList.remove('flash');
  },1400);
  speak('Et si vous faisiez : '+pick.label);
};

/* ================= Modal ================= */
function openModal(id=null){
  editingId=id;
  const t=id?tasks.find(x=>x.id===id):null;
  modalTitle.textContent=t?'Modifier la tâche':'Nouvelle tâche';
  saveBtn.textContent=t?'Enregistrer':'Ajouter';
  input.value=t?t.label:'';
  overlay.hidden=false; document.body.classList.add('locked');
  requestAnimationFrame(()=>input.focus());
}
function closeModal(){ overlay.hidden=true; document.body.classList.remove('locked'); editingId=null; }

$('#addBtn').onclick=()=>openModal();
$('#cancelBtn').onclick=closeModal;
overlay.addEventListener('click',e=>{ if(e.target===overlay) closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!overlay.hidden) closeModal(); });

form.addEventListener('submit',e=>{
  e.preventDefault();
  const label=input.value.trim(); if(!label) return;
  if(editingId){ const t=tasks.find(x=>x.id===editingId); if(t) t.label=label; }
  else tasks.push({id:uid(),label,done:false,createdAt:Date.now()});
  save(); closeModal(); render();
});

/* ================= Onglets ================= */
$('#tabs').addEventListener('click',e=>{
  const b=e.target.closest('.tab'); if(!b) return;
  filter=b.dataset.filter;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('is-active',t===b));
  render();
});

/* ================= Toasts / confettis ================= */
function toast(msg,action,timeout=3500){
  const el=document.createElement('div'); el.className='toast';
  const s=document.createElement('span'); s.textContent=msg; el.appendChild(s);
  const dismiss=()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(),300); };
  if(action){
    const b=document.createElement('button'); b.textContent=action.label;
    b.onclick=()=>{ action.fn(); dismiss(); }; el.appendChild(b);
  }
  toastsEl.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(dismiss,timeout);
}

function confetti(){
  const em=['🎉','✨','✅','🍃','⭐','🌟'];
  for(let i=0;i<28;i++){
    const s=document.createElement('span');
    s.className='confetti'; s.textContent=em[i%em.length];
    s.style.left=(Math.random()*100)+'vw';
    s.style.setProperty('--dx',(Math.random()*180-90)+'px');
    s.style.setProperty('--rz',(Math.random()*540-270)+'deg');
    s.style.animationDuration=(1+Math.random()*0.8)+'s';
    document.body.appendChild(s);
    s.addEventListener('animationend',()=>s.remove());
  }
}

/* ================= Voix (bouton) ================= */
function paintSound(){
  soundBtn.textContent=soundOn?'🔊':'🔇';
  soundBtn.setAttribute('aria-pressed',soundOn);
  soundBtn.title=soundOn?'Couper la voix':'Activer la voix';
}
soundBtn.onclick=()=>{
  soundOn=!soundOn;
  localStorage.setItem(SKEY,soundOn?'on':'off');
  paintSound();
  if(soundOn) speak('Voix activée'); else if('speechSynthesis' in window) speechSynthesis.cancel();
};

/* ================= Salutations ================= */
(function(){
  const h=new Date().getHours();
  $('#hello').textContent=(h>=5&&h<18?'Bonjour':'Bonsoir')+' ! 👋';
  const d=new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'}).format(new Date());
  $('#date').textContent=d.charAt(0).toUpperCase()+d.slice(1);
})();

/* ================= PWA : installation ================= */
let deferredPrompt=null;
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;

addEventListener('beforeinstallprompt',e=>{
  e.preventDefault(); deferredPrompt=e;
  if(!standalone) installBtn.hidden=false;
});
installBtn.addEventListener('click',async()=>{
  if(!deferredPrompt){ toast('Menu du navigateur → « Installer l'application » 🙂'); return; }
  await deferredPrompt.prompt();
  const {outcome}=await deferredPrompt.userChoice;
  if(outcome==='accepted') installBtn.hidden=true;
  deferredPrompt=null;
});
addEventListener('appinstalled',()=>{ installBtn.hidden=true; toast('EnCoche installée 🎉'); });

/* Astuce iOS */
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
if(isIOS&&!navigator.standalone&&!localStorage.getItem('encoche.ioshint')){
  $('#iosHint').hidden=false;
  $('#iosClose').onclick=()=>{ $('#iosHint').hidden=true; localStorage.setItem('encoche.ioshint','1'); };
}

/* ================= PWA : réseau & hors ligne ================= */
function updNet(){ netEl.hidden=navigator.onLine; }
addEventListener('offline',()=>{ updNet(); toast('Mode hors ligne — vos tâches restent enregistrées 💾'); });
addEventListener('online',()=>{ updNet(); toast('De retour en ligne ✅'); });
updNet();

/* ================= PWA : service worker ================= */
if('serviceWorker' in navigator&&(location.protocol==='https:'||['localhost','127.0.0.1'].includes(location.hostname))){
  addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}

/* ================= Sync inter-onglets & raccourci ================= */
addEventListener('storage',e=>{ if(e.key===KEY){ tasks=load(); render(); }});
if(new URLSearchParams(location.search).has('add')){
  history.replaceState({},'',location.pathname);
  setTimeout(()=>openModal(),350);
}

/* ================= Go ================= */
paintSound();
render();
</script>
</body>
</html>
